name: CI

# Three questions, asked on every push: does the Lua lint clean, would the
# client actually load this, and does the wire format still round-trip. The
# release workflow calls this same file, so nothing ships that has not answered
# all three.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This takes ~17s and stays that way on purpose. Caching the luarocks tree
      # was tried and reverted: apt is ~10s of it and cannot be cached away
      # since luacheck needs an interpreter, leaving an 8s ceiling, and tag runs
      # do not reliably see caches created on main, so releases never benefited.
      # Two extra steps for an unreliable 8s was the worse trade.
      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 luarocks
          sudo luarocks install luacheck

      # .luacheckrc lists every global this addon is allowed to touch, so a new
      # warning here is usually a leaked global rather than a style nit.
      - name: luacheck .
        run: luacheck .

  validate:
    name: packaging + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Catches the failures WoW reports by silently not loading the addon.
      - name: Validate .toc and .pkgmeta
        run: node tools/validate.mjs

      # The release workflow runs this same tool against the section it is about
      # to ship, where a finding fails the release. Running it on ## [Unreleased]
      # every push means the notes are already clean by the time a tag is cut,
      # instead of the pass being something discovered on release day. A section
      # with nothing under it yet is not a failure.
      - name: Slop pass on unreleased notes
        run: node tools/slop.mjs --unreleased

      # The half of the wb1! contract that can be tested without a game client:
      # encode a vector the way Export.lua does, decode it the way the website
      # will, and require the payload to survive the trip unchanged.
      - name: Contract vectors round-trip
        run: node tools/vector.mjs

      # Import.lua is the only file here that reads a string somebody else
      # produced, which makes it the only one where being wrong is a security
      # question. It is pure, so it can be tested without a game client — and
      # this runs against the golden wbc1! fixture the step above regenerates,
      # so the round trip is checked rather than each half in isolation.
      - name: Import decoder, junk-matching and gear-classification tests
        run: |
          sudo apt-get install -y --no-install-recommends lua5.1
          lua5.1 tools/import-test.lua
          lua5.1 tools/junk-test.lua
          lua5.1 tools/gear-test.lua

      # A drifted fixture means /app is testing against a string this addon no
      # longer produces. Regenerate with `node tools/vector.mjs --write`.
      - name: Committed .wb1 fixtures match
        run: |
          node tools/vector.mjs --write
          git diff --exit-code -- docs/contract/vectors \
            || { echo "::error::.wb1 fixtures are stale — run 'node tools/vector.mjs --write' and commit"; exit 1; }

  package:
    name: package (dry run)
    runs-on: ubuntu-latest
    needs: [lint, validate]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false

      # Same tool that does the real release, with uploads switched off. If
      # .pkgmeta is malformed, this is where it surfaces — not on a tag.
      - name: Build the zip
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      # A downloadable build for testers on every push to main, so trying a
      # change never requires cutting a version.
      #
      # include-hidden-files is not optional here: the packager writes to
      # .release/, upload-artifact treats a leading dot as hidden, and it skips
      # hidden paths by default — so the glob matches nothing and the step fails
      # having found the zip the packager just logged creating.
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: WarbandPro-${{ github.sha }}
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
